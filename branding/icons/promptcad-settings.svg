<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PromptCAD settings">
  <!--
    Settings icon. Sliders rather than the conventional gear: a gear's teeth
    collapse into a blob at 16px, and this dialog is about picking values
    (provider, model, keys) rather than machinery. The amber knob ties it to
    the caret in the master mark.
  -->
  <g fill="none" stroke="#0369A1" stroke-width="5" stroke-linecap="round">
    <path d="M13 19 H51"/>
    <path d="M13 32 H51"/>
    <path d="M13 45 H51"/>
  </g>
  <circle cx="38" cy="19" r="6.5" fill="#38BDF8"/>
  <circle cx="23" cy="32" r="6.5" fill="#F59E0B"/>
  <circle cx="43" cy="45" r="6.5" fill="#38BDF8"/>
</svg>
