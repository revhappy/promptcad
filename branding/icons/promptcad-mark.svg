<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PromptCAD">
  <!--
    PromptCAD master mark: a prompt floating above a solid.
    The isometric cube is the hero and carries the colour, so the mark reads
    as CAD first and does not collide with the flat dark-navy terminal icons
    (PowerShell et al). The chevron and caret sit in front of it with a soft
    shadow, so "> _" stays legible over all three faces.

    Used at 48px and up. Below that the cube smears, so the .ico's small
    frames come from promptcad-mark-flat.svg instead.
  -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="256">
      <stop offset="0" stop-color="#16223B"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#plate)"/>

  <!-- Isometric cube, centre (128,132), radius 96. The hexagon underneath the
       three faces stops antialiased hairlines showing along shared edges. -->
  <path d="M128 36 L211 84 L211 180 L128 228 L45 180 L45 84 Z" fill="#075985"/>
  <path d="M128 36 L211 84 L128 132 L45 84 Z" fill="#38BDF8"/>
  <path d="M45 84 L128 132 L128 228 L45 180 Z" fill="#0284C7"/>
  <path d="M211 84 L211 180 L128 228 L128 132 Z" fill="#075985"/>

  <!-- The prompt, laid out "> _" to match promptcad-mark-flat.svg. The caret
       sits on the darker right face, where amber has the most contrast.
       Shadow first: the prompt floats a little off the surface. -->
  <g fill="none" stroke="#062338" stroke-opacity="0.35"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M87 96 L133 138 L87 180" stroke-width="26"/>
    <path d="M162 173 L198 173" stroke-width="18"/>
  </g>

  <path d="M82 90 L128 132 L82 174" fill="none" stroke="#F8FAFC"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M158 168 L194 168" fill="none" stroke="#F59E0B"
        stroke-width="18" stroke-linecap="round"/>
</svg>
